function daysLeft(){
  const t = new Date(D.showcase.date + 'T09:00:00+01:00');
  const now = new Date();
  const a = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const b = Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate());
  return Math.round((b - a) / 864e5);
}
function countdown(){
  const n = daysLeft();
  if (n > 1) return `<span class="pill go"><b>${n}</b> days to go</span>`;
  if (n === 1) return `<span class="pill go"><b>1</b> day to go. Tomorrow!</span>`;
  if (n === 0) return `<span class="pill go"><b>Today</b> is showcase day</span>`;
  return `<span class="pill go">Thank you for coming</span>`;
}

function build(p){
  const L = p.notebook, P = L.pack;
  const step0 = `
    <ol class="steps0">
      <li><b>Start a new project.</b> Delete the cat (Sprite1). We do not need it.</li>
      <li><b>Upload the backdrop${P.backdrops.length>1?'s':''}</b> (Stage, then Upload Backdrop). Rename ${P.backdrops.length>1?'each one':'it'} exactly:
        <div class="tscroll"><table class="rt up"><thead><tr><th>Upload this file</th><th>Rename to</th></tr></thead><tbody>
        ${P.backdrops.map(b=>`<tr><td>${esc(b.file)}</td><td><b>${esc(b.name)}</b></td></tr>`).join('')}</tbody></table></div></li>
      ${P.box?`<li><b>Make our one box.</b> Variables, Make a Variable, name it <span class="bk vr">${esc(P.box)}</span>, For all sprites.</li>`:''}
      <li><b>Upload the sprites in number order: 01, 02, 03...</b> (Choose a Sprite, then Upload Sprite). Scratch calls each one Sprite + a number. Rename it at once, and say its job out loud:
        <div class="tscroll"><table class="rt up"><thead><tr><th>File</th><th>Scratch calls it</th><th>Rename to</th><th>Its job</th></tr></thead><tbody>
        ${P.sprites.map((x,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td>${esc(x.inner)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.job)}</td></tr>`).join('')}</tbody></table></div></li>
    </ol>
    <div class="note"><b>In your notebook</b><p>Write the name of every sprite and its job in one short line. Example: "${esc(P.sprites[P.sprites.length>2?2:0].name)}: ${esc(P.sprites[P.sprites.length>2?2:0].job)}"</p></div>`;
  let n = 0;
  const screen = (S, i) => {
    const body = `
      <div class="bea"><div><b>Before</b><p>${esc(S.before)}</p></div><div><b>Event</b><p>${esc(S.event)}</p></div><div><b>After</b><p>${esc(S.after)}</p></div></div>
      <div class="note"><b>Notebook questions</b><p>Write your answer first. Then tap to check.</p>
        <div class="qa">${S.qa.map(([q,a],k)=>`<details class="q"><summary>${k+1}. ${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div></div>
      <h3 class="bh">Now we build it</h3>
      <div class="sprites">${S.sprites.map(x=>blocksOf(x, ++n)).join('')}</div>`;
    return i < 2 ? `<section class="scr"><h2>${esc(S.title)}</h2>${body}</section>`
                 : `<details class="grp scr"><summary><h2>${esc(S.title)}</h2><span>open</span></summary>${body}</details>`;
  };
  return `
  <div class="flow3"><div><b>Before</b><span>What is on the screen? Who is waiting?</span></div><div><b>Event</b><span>What starts it? A click or a message.</span></div><div><b>After</b><span>What changed? Which message is passed on?</span></div></div>
  <p class="hint">Every screen, we ask the same 3 things. Draw 3 columns in your notebook: BEFORE, EVENT, AFTER. We go screen by screen, all together. Nobody moves to the next screen until this one works.</p>
  <section class="scr"><h2>Step 0: Upload and rename</h2>${step0}</section>

  <div class="legend">${Object.entries(BK).map(([k,v])=>`<span class="bk ${k}">${v}</span>`).join('')}</div>`;

function bindProject(p){
  const tabs = document.querySelectorAll('[data-tab]');
  tabs.forEach(t => t.onclick = () => {
    tabs.forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); document.getElementById('pane-' + x.dataset.tab).hidden = !on; });
    const tb = document.querySelector('.tabs'); if (tb.getBoundingClientRect().top < 60) tb.scrollIntoView({block:'start'});
  });
  // timer
  const T = 120, clock = $('#clock'), go = $('#tgo');
  const bars = [...document.querySelectorAll('.tbar span')];
  let start = 0, used = 0, iv = null;
  const paint = () => {
    const s = Math.min(T, used + (iv ? (Date.now() - start) / 1000 : 0));
    const left = Math.ceil(T - s);
    clock.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    const part = Math.min(3, Math.floor(s / 30));
    bars.forEach((b, j) => b.style.width = Math.max(0, Math.min(1, (s - j * 30) / 30)) * 100 + '%');
    document.querySelectorAll('.part').forEach((el, j) => el.classList.toggle('now', (iv || s > 0) && j === part && s < T));
    if (s >= T && iv) { clearInterval(iv); iv = null; used = T; go.textContent = 'Done'; go.disabled = true; clock.textContent = 'Time!'; }
  };
  go.onclick = () => {
    if (iv) { used += (Date.now() - start) / 1000; clearInterval(iv); iv = null; go.textContent = 'Continue'; }
    else { start = Date.now(); iv = setInterval(paint, 200); go.textContent = 'Pause'; }
    paint();
  };
  $('#treset').onclick = () => { clearInterval(iv); iv = null; used = 0; go.disabled = false; go.textContent = 'Start'; paint(); };
  timerState = () => clearInterval(iv);
  // drill
  const pool = p.judges.concat(p.visitors); let last = -1, cur = null;
  $('#dnext').onclick = () => {
    let k; do { k = Math.floor(Math.random() * pool.length); } while (pool.length > 1 && k === last);
    last = k; cur = pool[k];
    $('#dask').textContent = cur[0]; $('#dans').hidden = true; $('#dshow').disabled = false; $('#dnext').textContent = 'Next question';
  };
  $('#dshow').onclick = () => { if (!cur) return; $('#dans').textContent = cur[1]; $('#dans').hidden = false; };
  // tasks
  document.querySelectorAll('.task input').forEach(c => c.onchange = () => {
    const s = store.get('tasks:' + p.id, []); s[+c.dataset.j] = c.checked; store.set('tasks:' + p.id, s);
    c.closest('.task').classList.toggle('done', c.checked);
    const n = s.filter(Boolean).length; $('#pbar').style.width = n * 20 + '%'; $('#pcount').textContent = n + '/5';
  });
}

  });
}

/* ---------- ROUTER ---------- */
function route(){
  if (timerState) { timerState(); timerState = null; }
  const h = decodeURIComponent(location.hash.slice(1));
  const app = $('#app');
  let nav = 'home';
  if (BY[h]) { app.innerHTML = project(BY[h]); bindProject(BY[h]); nav = ''; window.scrollTo(0, 0); }
  else if (h === 'words') { app.innerHTML = words(); bindWords(); nav = 'words'; window.scrollTo(0, 0); }
  else if (h === 'on-the-day') { app.innerHTML = day(); bindDay(); nav = 'on-the-day'; window.scrollTo(0, 0); }
  else {
    const fromProject = !!app.querySelector('.p-head');
    app.innerHTML = home(); bindHome();
    if (h === 'projects') { const el = document.getElementById('projects'); if (el) el.scrollIntoView(); }
    else if (fromProject || h) window.scrollTo(0, 0);
  }
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
window.addEventListener('hashchange', route);
route();
</script>
