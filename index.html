pays."], ["Repeat", "The time bar repeats 10 times: wait 1 second, take 1 from Time."]], "tested": ["Save 3 notes a week: the kolo reaches ₦1,400. Ada buys the book.", "Save 2 notes a week: the kolo reaches ₦800. Not enough.", "Save nothing in week 1: in week 2 only ₦600 is left to share."], "speech": ["Many of us spend our pocket money the same day we get it. Then an emergency comes, and nothing is saved. Our game, Naira Wise, is for students and parents.", "Ada gets ₦1,000 every week. She has 10 seconds to give every ₦200 a job: save, spend or give. Money with no job disappears. In week 2 her sandal breaks.", "Each sprite comes out, does its work and calls the next one. The boxes remember Week, Pocket and Kolo. The cobbler checks: is the kolo less than ₦400? The clock uses repeat.", "Saving 3 notes a week reached ₦1,400. Saving 2 was not enough. Next, we want players to choose their own goal. Our lesson: give every naira a job."], "judges": [["What problem does your game solve?", "Young people spend money without a plan, so they have nothing for emergencies."], ["Show us where the game decides something.", "The cobbler: is the kolo less than ₦400? Yes: the pocket pays. No: the kolo pays."], ["What if a player clicks a jar with an empty pocket?", "The jar checks first. It says \"The pocket is empty!\" and nothing changes."], ["What is a variable in your game?", "A box that remembers a number. Kolo remembers Ada's savings."], ["Why does unplanned money disappear?", "In real life, money with no plan gets spent on small things."], ["What would you improve?", "Let the player choose their own goal, like a bag or school fees."]], "visitors": [["Why only ₦200 notes?", "To keep the maths simple: 5 notes make ₦1,000."], ["Can my child play it at home?", "Yes, on scratch.mit.edu in a web browser."], ["What did you learn?", "Save first, then spend."]], "next": ["Choose your own goal.", "An emergency that can come in any week.", "A bonus for saving 4 weeks in a row."], "practice": ["Say all the screens in order without looking.", "Guess the kolo if Ada saves 4 notes every week. Then play.", "Make the goal ₦1,200. How many notes must Ada save?", "Make Ada say something new in week 3.", "Explain the cobbler's check at home with a tin and paper money."], "guide": {"title": "Naira Wise", "intro": "Ada gets ₦1,000 every week for 3 weeks. She has 10 seconds a week to give every ₦200 note a job: save, spend or give. In week 2 her sandal breaks. Can she save ₦1,000 for her storybook?", "sprites": [["Title", "The big \"Naira Wise\" sign. It shows first."], ["Play Button", "PLAY. When clicked, it starts week 1."], ["Week Banner", "Shows WEEK 1, WEEK 2 or WEEK 3. It also counts the weeks and decides when the game ends."], ["Mum", "Gives Ada ₦1,000 pocket money every week."], ["Ada", "The girl saving for a storybook. She checks the week, her pocket and her kolo."], ["Emergency", "The broken sandal picture. It only shows in week 2."], ["Cobbler", "Fixes the sandal for ₦400. He checks if the kolo can pay."], ["Time Bar", "The 10-second clock. When it ends, it shouts \"time is up\"."], ["Save Jar", "Click it to put ₦200 into the kolo (savings)."], ["Spend Jar", "Click it to spend ₦200 on snacks."], ["Give Jar", "Click it to give ₦200 to a friend."], ["Leak Note", "The note that flies away when money has no job."], ["Storybook", "Ada's goal. It comes out only if the kolo reaches ₦1,000."]], "backdrops": ["room"], "boxes": ["Week", "Time", "Pocket ₦", "Kolo ₦", "Goal ₦"], "flag": [["Title", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Play Button", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Week Banner", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Mum", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Ada", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Emergency", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Cobbler", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Time Bar", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Save Jar", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Spend Jar", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Give Jar", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Leak Note", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Storybook", [[["ev", "when green flag clicked"], ["lk", "hide"]], [["ev", "when green flag clicked"], ["lk", "set size to 60 %"]]]]], "steps": [{"title": "Step 3: The Stage sets the rules and shouts", "text": "The Stage switches to the room backdrop and fills every box with its starting number: Week 0, Time 10, Pocket 0, Kolo 0, Goal 1000. Then it shouts \"show title screen\".", "qa": [["What does Goal ₦ start at, and does it ever change?", "1000. It never changes. It is the price of the storybook."], ["What is the last thing the Stage does?", "It broadcasts \"show title screen\"."]], "test": "Click the green flag: you see only the room. Every sprite is hidden. All five boxes show their starting numbers.", "items": [["Stage", [[["ev", "when green flag clicked"], ["lk", "switch backdrop to room"], ["vr", "set Week to 0"], ["vr", "set Time to 10"], ["vr", "set Pocket ₦ to 0"], ["vr", "set Kolo ₦ to 0"], ["vr", "set Goal ₦ to 1000"], ["ev", "broadcast \"show title screen\""]]]]]}, {"title": "Step 4: Only the Title and PLAY listen", "text": "The Title and PLAY are the only sprites that listen for \"show title screen\", so only they come out. When PLAY is clicked, it shouts \"new week starts\". The Title and PLAY hear that same message and hide.", "qa": [["Which message makes the Title and PLAY hide?", "\"new week starts\", the same message PLAY shouts."], ["Who else listens for \"new week starts\"?", "The Week Banner. It starts week 1."]], "test": "Click the green flag: the title and PLAY come out. Click PLAY: they both hide.", "items": [["Title", [[["ev", "when I receive \"show title screen\""], ["mo", "go to x: 0 y: 50"], ["lk", "show"]]]], ["Play Button", [[["ev", "when I receive \"show title screen\""], ["mo", "go to x: 0 y: -70"], ["lk", "show"]], [["ev", "when this sprite clicked"], ["so", "start sound pop"], ["ev", "broadcast \"new week starts\""]]]], ["Title", [[["ev", "when I receive \"new week starts\""], ["lk", "hide"]]]], ["Play Button", [[["ev", "when I receive \"new week starts\""], ["lk", "hide"]]]]]}, {"title": "Step 5: A new week starts", "text": "The Week Banner hears \"new week starts\". It adds 1 to Week, switches its costume to the Week number (WEEK 1, WEEK 2 or WEEK 3), shows for 1.5 seconds, hides, then shouts \"mum gives pocket money\".", "qa": [["Why \"switch costume to (Week)\"?", "Week 1 shows costume 1, week 2 shows costume 2. One block shows all 3 banners."], ["What does the banner shout when it hides?", "\"mum gives pocket money\"."]], "test": "Click PLAY: \"WEEK 1\" shows, and the Week box becomes 1.", "items": [["Week Banner", [[["ev", "when I receive \"new week starts\""], ["vr", "change Week by 1"], ["lk", "switch costume to (Week)"], ["mo", "go to x: 0 y: 40"], ["lk", "show"], ["so", "start sound whoosh"], ["ct", "wait 1.5 seconds"], ["lk", "hide"], ["ev", "broadcast \"mum gives pocket money\""]]]]]}, {"title": "Step 6: Mum gives the pocket money", "text": "Mum hears \"mum gives pocket money\". She shows, adds 1000 to Pocket ₦, says one line, hides, then shouts \"ada checks the week\".", "qa": [["Which box goes up, and by how much?", "Pocket ₦ goes up by 1000."]], "test": "After the banner, Mum appears and Pocket ₦ becomes 1000.", "items": [["Mum", [[["ev", "when I receive \"mum gives pocket money\""], ["mo", "go to x: 190 y: -30"], ["lk", "show"], ["so", "start sound cash"], ["vr", "change Pocket ₦ by 1000"], ["lk", "say \"Here is your ₦1,000 for this week, Ada.\" for 2.5 seconds"], ["lk", "hide"], ["ev", "broadcast \"ada checks the week\""]]]]]}, {"title": "Step 7: Ada checks the week", "text": "Ada hears \"ada checks the week\". She asks one question: is Week = 2? YES: she looks sad, says her sandal broke, and shouts \"sandal breaks\". NO: she smiles, says she has 10 seconds, and shouts \"jars and 10 second clock start\".", "qa": [["In which week does the sandal break?", "Week 2."], ["In weeks 1 and 3, which message does Ada shout?", "\"jars and 10 second clock start\"."]], "test": "Week 1: Ada says \"Quick! 10 seconds to give every ₦200 a job!\"", "items": [["Ada", [[["ev", "when I receive \"ada checks the week\""], ["mo", "go to x: -200 y: -10"], ["lk", "show"], ["ct", "if <(Week) = 2> then", [["lk", "switch costume to sad"], ["lk", "say \"Oh no! My sandal just broke!\" for 2 seconds"], ["ev", "broadcast \"sandal breaks\""]], [["lk", "switch costume to smile"], ["lk", "say \"Quick! 10 seconds to give every ₦200 a job!\" for 2.5 seconds"], ["ev", "broadcast \"jars and 10 second clock start\""]]]]]]]}, {"title": "Step 8: Week 2: the sandal breaks", "text": "The broken sandal and the Cobbler both hear \"sandal breaks\". The sandal shows. The Cobbler shows and asks one question: is Kolo ₦ < 400? YES: there is not enough savings, so Pocket ₦ goes down by 400. NO: the savings pay, so Kolo ₦ goes down by 400. Then he hides and shouts \"jars and 10 second clock start\". The sandal hears that and hides.", "qa": [["If Ada saved nothing in week 1, who pays for the sandal?", "Her pocket money: Pocket ₦ goes down by 400."], ["What is the lesson of this step?", "Savings help in an emergency."]], "test": "Save nothing in week 1: in week 2 the cobbler takes ₦400 from the pocket, so only ₦600 is left to share.", "items": [["Emergency", [[["ev", "when I receive \"sandal breaks\""], ["mo", "go to x: 0 y: 40"], ["lk", "show"]], [["ev", "when I receive \"jars and 10 second clock start\""], ["lk", "hide"]]]], ["Cobbler", [[["ev", "when I receive \"sandal breaks\""], ["mo", "go to x: 205 y: -40"], ["lk", "show"], ["lk", "say \"Your sandal is broken. I can fix it for ₦400.\" for 2.5 seconds"], ["ct", "if <(Kolo ₦) < 400> then", [["lk", "say \"No savings? Then the ₦400 comes from your pocket money.\" for 3 seconds"], ["vr", "change Pocket ₦ by -400"]], [["lk", "say \"Thank you! Paid from your kolo. Saving helps in emergencies.\" for 3 seconds"], ["vr", "change Kolo ₦ by -400"]]], ["lk", "hide"], ["ev", "broadcast \"jars and 10 second clock start\""]]]]]}, {"title": "Step 9: The 10-second clock and the three jars", "text": "Four sprites hear \"jars and 10 second clock start\". The Time Bar sets Time to 10 and repeats 10 times: show the costume for Time, wait 1 second, take 1 from Time. Then it shouts \"time is up\". The three jars come out. Each jar, when clicked, asks: is Pocket ₦ > 0? YES: Pocket ₦ goes down by 200 (the Save Jar also adds 200 to Kolo ₦) and the jar says its line. NO: it says \"The pocket is empty!\" When the jars hear \"time is up\", they hide.", "qa": [["Which jar is the only one that changes Kolo ₦?", "The Save Jar."], ["Why does each jar check Pocket ₦ > 0 first?", "So Ada cannot spend money she does not have."], ["How many seconds does the clock run?", "10. The repeat runs 10 times with a 1-second wait."]], "test": "Click the Save Jar 3 times: Pocket ₦ goes 1000, 800, 600, 400 and Kolo ₦ goes up to 600.", "items": [["Time Bar", [[["ev", "when I receive \"jars and 10 second clock start\""], ["vr", "set Time to 10"], ["mo", "go to x: 40 y: 100"], ["lk", "show"], ["ct", "repeat 10", [["lk", "switch costume to (Time)"], ["ct", "wait 1 seconds"], ["vr", "change Time by -1"]]], ["lk", "switch costume to t0"], ["ev", "broadcast \"time is up\""]]]], ["Save Jar", [[["ev", "when I receive \"jars and 10 second clock start\""], ["mo", "go to x: -150 y: -92"], ["lk", "show"]], [["ev", "when I receive \"time is up\""], ["lk", "hide"]], [["ev", "when this sprite clicked"], ["ct", "if <(Pocket ₦) > 0> then", [["vr", "change Pocket ₦ by -200"], ["vr", "change Kolo ₦ by 200"], ["so", "start sound pop"], ["lk", "say \"Into my kolo! Saving for my goal.\" for 0.6 seconds"]], [["so", "start sound buzz"], ["lk", "say \"The pocket is empty!\" for 1 seconds"]]]]]], ["Spend Jar", [[["ev", "when I receive \"jars and 10 second clock start\""], ["mo", "go to x: 0 y: -92"], ["lk", "show"]], [["ev", "when I receive \"time is up\""], ["lk", "hide"]], [["ev", "when this sprite clicked"], ["ct", "if <(Pocket ₦) > 0> then", [["vr", "change Pocket ₦ by -200"], ["so", "start sound pop"], ["lk", "say \"Puff-puff! Yummy!\" for 0.6 seconds"]], [["so", "start sound buzz"], ["lk", "say \"The pocket is empty!\" for 1 seconds"]]]]]], ["Give Jar", [[["ev", "when I receive \"jars and 10 second clock start\""], ["mo", "go to x: 150 y: -92"], ["lk", "show"]], [["ev", "when I receive \"time is up\""], ["lk", "hide"]], [["ev", "when this sprite clicked"], ["ct", "if <(Pocket ₦) > 0> then", [["vr", "change Pocket ₦ by -200"], ["so", "start sound pop"], ["lk", "say \"I shared with my friend.\" for 0.6 seconds"]], [["so", "start sound buzz"], ["lk", "say \"The pocket is empty!\" for 1 seconds"]]]]]]]}, {"title": "Step 10: Time is up: does any money have no job?", "text": "Ada also hears \"time is up\". She asks: is Pocket ₦ > 0? YES: some money had no job. She says so and shouts \"leftover money disappears\" and waits. The Leak Note hears it: it shows, says \"Money with no plan disappears!\", sets Pocket ₦ to 0 and hides. NO: Ada is happy. Either way, Ada then shouts \"check if 3 weeks are done\".", "qa": [["What happens to money left in the pocket?", "It disappears: the Leak Note sets Pocket ₦ to 0."], ["Why \"broadcast and wait\"?", "Ada waits for the Leak Note to finish before she moves on."]], "test": "Leave one note unused: the Leak Note appears and Pocket ₦ becomes 0.", "items": [["Ada", [[["ev", "when I receive \"time is up\""], ["ct", "if <(Pocket ₦) > 0> then", [["lk", "switch costume to sad"], ["lk", "say \"Oh! Some of my money had no job.\" for 2 seconds"], ["ev", "broadcast \"leftover money disappears\" and wait"]], [["lk", "switch costume to happy"], ["lk", "say \"Every naira had a job. Well done me!\" for 2 seconds"]]], ["ev", "broadcast \"check if 3 weeks are done\""]]]], ["Leak Note", [[["ev", "when I receive \"leftover money disappears\""], ["mo", "go to x: 0 y: 40"], ["lk", "show"], ["lk", "say \"Money with no plan disappears!\" for 2.5 seconds"], ["vr", "set Pocket ₦ to 0"], ["lk", "hide"]]]]]}, {"title": "Step 11: Another week, or the end?", "text": "The Week Banner hears \"check if 3 weeks are done\". It asks: is Week < 3? YES: it shouts \"new week starts\" and Step 5 happens again. That is a loop made of messages. NO: it shouts \"ada checks her kolo\".", "qa": [["How does the game play 3 weeks without a repeat block?", "The banner shouts \"new week starts\" again until Week is 3."]], "test": "After week 1, \"WEEK 2\" shows and Mum gives ₦1,000 again.", "items": [["Week Banner", [[["ev", "when I receive \"check if 3 weeks are done\""], ["ct", "if <(Week) < 3> then", [["ev", "broadcast \"new week starts\""]], [["ev", "broadcast \"ada checks her kolo\""]]]]]]]}, {"title": "Step 12: The end: can Ada buy the storybook?", "text": "Ada hears \"ada checks her kolo\". She asks: is Kolo ₦ < Goal ₦? YES: no storybook. NO: she is happy and shouts \"buy the storybook\". The Storybook hears it: Kolo ₦ goes down by 1000, it shows and grows bigger.", "qa": [["Which two boxes does Ada compare?", "Kolo ₦ and Goal ₦."], ["Save 3 notes every week. What is the kolo after buying the book?", "₦400. The kolo reached ₦1,400, and the book cost ₦1,000."]], "test": "Save 3 notes every week: Ada buys the book and Kolo ₦ shows 400.", "items": [["Ada", [[["ev", "when I receive \"ada checks her kolo\""], ["ct", "if <(Kolo ₦) < (Goal ₦)> then", [["lk", "switch costume to sad"], ["so", "start sound sad"], ["lk", "say \"My kolo has less than my goal. No storybook. Next time I SAVE first!\""]], [["lk", "switch costume to happy"], ["so", "start sound fanfare"], ["lk", "say \"My kolo reached my goal! I can buy my storybook!\""], ["ev", "broadcast \"buy the storybook\""]]]]]], ["Storybook", [[["ev", "when I receive \"buy the storybook\""], ["vr", "change Kolo ₦ by -1000"], ["mo", "go to x: 120 y: -40"], ["lk", "show"], ["so", "start sound star"], ["ct", "repeat 10", [["lk", "change size by 4"], ["ct", "wait 0.05 seconds"]]]]]]]}], "files": ["01 Title.sprite3", "02 Play Button.sprite3", "03 Week Banner.sprite3", "04 Mum.sprite3", "05 Ada.sprite3", "06 Emergency.sprite3", "07 Cobbler.sprite3", "08 Time Bar.sprite3", "09 Save Jar.sprite3", "10 Spend Jar.sprite3", "11 Give Jar.sprite3", "12 Leak Note.sprite3", "13 Storybook.sprite3"]}, "simple": "Ada gets ₦1,000 from her mum every week. She has 10 seconds to put each ₦200 note in a jar: save, spend or give. Money with no job disappears. In week 2 her sandal breaks. Can she still save enough for her storybook?"}, {"id": "race-against-rot", "title": "Race Against Rot", "track": "scratch", "school": "Yewa College", "lesson": "Keep it cool, sell it fresh.", "line": "Choose how to store 100 tomatoes on the way to market, and see what you earn.", "problem": "Tomatoes rot on the hot road to market. Every rotten tomato is money lost.", "who": "Farming families, traders and students who live near farms.", "how": ["The farmer has 100 tomatoes and an 8-second trip.", "Choose a way to store them: open air, a clay pot cooler or sun-drying.", "Every second, some tomatoes rot.", "The buyer pays only for fresh tomatoes."], "ideas": [["Events", "A storage card calls \"drive to market\". The trip map calls \"buyer pays\"."], ["Boxes", "Time, Tomatoes, Rot, Price and Money."], ["Checks", "At the end the farmer asks: is Money more than ₦7,000?"], ["Repeat", "A repeat inside a repeat: every second, Rot tomatoes go bad."]], "tested": ["Open air: 36 tomatoes, ₦3,600.", "Clay pot: 76 tomatoes, ₦7,600. The best.", "Sun-dry: 92 tomatoes, but they sell for ₦50 each: ₦4,600."], "speech": ["Farmers lose many tomatoes on the way to market because of heat. Our game, Race Against Rot, is for farming families and traders.", "The farmer has 100 tomatoes and an 8-second trip. You choose how to store them: open air, a clay pot cooler or sun-drying. The buyer pays only for fresh ones.", "The Rot box remembers how many go bad each second. A repeat inside a repeat takes them away. The buyer adds the price once for every tomato: that is multiplying.", "Open air gave ₦3,600, sun-drying ₦4,600, and the clay pot ₦7,600. Next, we want to add the cost of each storage method. Our lesson: keep food cool."], "judges": [["What problem does your game solve?", "Tomatoes rot on the way to market. The game shows how storage changes what farmers earn."], ["Why is the clay pot best?", "Only 3 tomatoes rot each second, and they still sell for ₦100."], ["Show us a loop.", "The trip map repeats 8 times. Inside, it repeats Rot times to take tomatoes away."], ["How does the buyer multiply?", "Repeat Tomatoes times: add the price. 76 tomatoes means adding ₦100 seventy-six times."], ["What if a player clicks two cards?", "Each card checks that nothing is chosen yet. The second click only buzzes."], ["What would you improve?", "The cost of each storage method, and a rainy day."]], "visitors": [["What is a clay pot cooler?", "A pot inside a bigger pot, with wet sand between them. The water keeps the inside cool."], ["Why not always sun-dry?", "Dried tomatoes sell for less."], ["What did you learn?", "Compare storage before the trip."]], "next": ["A cost for each storage method.", "A far market that pays more, but more tomatoes rot.", "Rain or traffic that adds time."], "practice": ["Say what each card puts in Rot and Price.", "Guess: if Rot was 5, how many tomatoes are left? Then test it.", "Make the trip 10 seconds. Which storage still wins?", "Make the farmer say how many tomatoes were lost.", "Act out the rot with 20 bottle caps."], "guide": {"title": "Race Against Rot", "intro": "100 tomatoes and an 8-second trip to the market. How you store them decides how many rot on the way. The buyer pays only for fresh tomatoes.", "sprites": [["Title", "The big \"Race Against Rot\" sign. It shows first."], ["Play Button", "PLAY. When clicked, the farmer starts talking."], ["Farmer", "Explains the problem at the start, and checks the money at the end."], ["Open Air Card", "Storage choice 1: open air. 8 tomatoes rot every second. Price ₦100."], ["Clay Pot Card", "Storage choice 2: clay pot cooler. 3 tomatoes rot every second. Price ₦100."], ["Sun-Dry Card", "Storage choice 3: sun-drying. 1 tomato rots every second, but dried tomatoes sell for ₦50."], ["Truck", "Drives along the road while the clock runs."], ["Trip Map", "The 8-second clock. Every second, it takes away the rotten tomatoes."], ["Buyer", "At the market, she pays the price for every fresh tomato."]], "backdrops": ["farm", "road", "market"], "boxes": ["Time", "Tomatoes", "Rot", "Price ₦", "Money ₦"], "flag": [["Title", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Play Button", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Farmer", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Open Air Card", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Clay Pot Card", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Sun-Dry Card", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Truck", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Trip Map", [[["ev", "when green flag clicked"], ["lk", "hide"]]]], ["Buyer", [[["ev", "when green flag clicked"], ["lk", "hide"]]]]], "steps": [{"title": "Step 3: The Stage sets the rules and shouts", "text": "The Stage switches to the farm backdrop and fills every box: Time 8, Tomatoes 100, Rot 0, Price ₦ 0, Money ₦ 0. Then it shouts \"show title screen\". (The Stage has two more scripts later: it shows the road and then the market.)", "qa": [["How many tomatoes does the farmer start with?", "100."], ["Why does Rot start at 0?", "No storage is chosen yet. A card will put the real number in Rot."]], "test": "Click the green flag: only the farm shows. The boxes show 8, 100, 0, 0, 0.", "items": [["Stage", [[["ev", "when green flag clicked"], ["lk", "switch backdrop to farm"], ["vr", "set Time to 8"], ["vr", "set Tomatoes to 100"], ["vr", "set Rot to 0"], ["vr", "set Price ₦ to 0"], ["vr", "set Money ₦ to 0"], ["ev", "broadcast \"show title screen\""]]]]]}, {"title": "Step 4: Only the Title and PLAY listen", "text": "Only the Title and PLAY listen for \"show title screen\", so only they come out. When PLAY is clicked, it shouts \"farmer explains\". The Title and PLAY hear that same message and hide.", "qa": [["Which message makes the Title and PLAY hide?", "\"farmer explains\"."]], "test": "Click PLAY: the title and PLAY hide.", "items": [["Title", [[["ev", "when I receive \"show title screen\""], ["mo", "go to x: 0 y: 50"], ["lk", "show"]]]], ["Play Button", [[["ev", "when I receive \"show title screen\""], ["mo", "go to x: 0 y: -70"], ["lk", "show"]], [["ev", "when this sprite clicked"], ["so", "start sound pop"], ["ev", "broadcast \"farmer explains\""]]]], ["Title", [[["ev", "when I receive \"farmer explains\""], ["lk", "hide"]]]], ["Play Button", [[["ev", "when I receive \"farmer explains\""], ["lk", "hide"]]]]]}, {"title": "Step 5: The farmer explains", "text": "The Farmer hears \"farmer explains\". He shows, says two lines, then shouts \"show storage cards\".", "qa": [["What does the farmer shout after talking?", "\"show storage cards\"."]], "test": "Click PLAY: the farmer appears and talks.", "items": [["Farmer", [[["ev", "when I receive \"farmer explains\""], ["lk", "switch costume to wave"], ["mo", "go to x: -195 y: -95"], ["lk", "show"], ["lk", "say \"100 fresh tomatoes! The market is 8 seconds away.\" for 3 seconds"], ["lk", "say \"How should we store them for the trip? Click a card.\" for 3 seconds"], ["ev", "broadcast \"show storage cards\""]]]]]}, {"title": "Step 6: The three storage cards", "text": "The three cards hear \"show storage cards\" and come out. Each card, when cli , then take away 1 tomato, Rot times (a repeat inside a repeat), then next costume. After 8 seconds it shouts \"buyer pays\".", "qa": [["With the clay pot cooler, how many tomatoes rot every second?", "3. After 8 seconds, 24 have rotted and 76 are left."], ["Why a repeat inside a repeat?", "The big repeat counts the 8 seconds. The small repeat takes away Rot tomatoes each second."]], "test": "Clay pot: Tomatoes goes 100, 97, 94... and ends at 76.", "items": [["Stage", [[["ev", "when I receive \"drive to market\""], ["lk", "switch backdrop to road"]]]], ["Farmer", [[["ev", "when I receive \"drive to market\""], ["lk", "hide"]]]], ["Truck", [[["ev", "when I receive \"drive to market\""], ["mo", "go to x: -200 y: -78"], ["lk", "show"], ["so", "start sound horn"], ["ct", "repeat until <(Time) < 1>", [["mo", "change x by 5"], ["ct", "wait 0.1 seconds"]]]]]], ["Trip Map", [[["ev", "when I receive \"drive to market\""], ["lk", "switch costume to m0"], ["mo", "go to x: 0 y: 120"], ["lk", "show"], ["ct", "repeat 8", [["ct", "wait 1 seconds"], ["vr", "change Time by -1"], ["ct", "repeat (Rot)", [["vr", "change Tomatoes by -1"]]], ["lk", "next costume"]]], ["ev", "broadcast \"buyer pays\""]]]]]}, {"title": "Step 8: The buyer pays", "text": "Four sprites hear \"buyer pays\". The Stage switches to the market. The Truck and the Trip Map hide. The Buyer shows, says one line, then repeats (Tomatoes) times: add Price ₦ to Money ₦. Adding again and again is how multiplying works. Then she says \"Paid!\" and shouts \"farmer checks the money\".", "qa": [["Clay pot: 76 tomatoes at ₦100. What is Money ₦?", "₦7,600."], ["Sun-dry: 92 tomatoes at ₦50. What is Money ₦?", "₦4,600."]], "test": "Clay pot: Money ₦ counts up to 7600.", "items": [["Stage", [[["ev", "when I receive \"buyer pays\""], ["lk", "switch backdrop to market"]]]], ["Truck", [[["ev", "when I receive \"buyer pays\""], ["lk", "hide"]]]], ["Trip Map", [[["ev", "when I receive \"buyer pays\""], ["lk", "hide"]]]], ["Buyer", [[["e nday.", "problem": "Families sometimes spend too much on parties, then borrow and struggle to pay back.", "who": "Students and families who plan celebrations.", "how": ["You have ₦200,000 and 30 seconds to plan.", "Click cards to buy jollof, canopy, DJ and more.", "You can borrow ₦50,000 once.", "On Monday the lender wants ₦60,000 back."], "ideas": [["Events", "The Party Time button calls \"party starts\". The caption calls \"monday comes\" if there is debt."], ["Boxes", "Time, Budget, Joy and Debt."], ["Checks", "Each card asks: is the budget less than my price? Yes: too expensive. No: buy it."], ["Repeat", "The Party Time button is the clock: repeat until Time is 0."]], "tested": ["Jollof, canopy, DJ and small chops cost exactly ₦200,000: a sweet party with no debt.", "Borrow and keep buying: on Monday, \"You still owe me!\"", "Borrow a little and stop: Monday is paid, and ₦110,000 is left."], "speech": ["Many families spend too much on parties, then borrow and struggle to pay back. Our game, The Great Owambe Budget, is for students and families.", "You have ₦200,000 and 30 seconds to plan. Every card costs money. You can borrow ₦50,000, but on Monday you must pay back ₦60,000.", "The Budget box remembers our money. Every card checks first: is the budget less than my price? The Party Time button is also the 30-second clock.", "With no loan, four items cost exactly ₦200,000. With a loan, Monday came and we still owed. Next, we want guests who need food. Our lesson: plan for Monday."], "judges": [["What problem does your game solve?", "Overspending and borrowing for parties."], ["Why is the debt ₦60,000?", "The lender charges ₦10,000 extra. Borrowing always costs more."], ["Show us a check.", "Each card asks: is the budget less than my price? Yes: too expensive. No: pay and add 1 joy."], ["What stops a player borrowing many times?", "The borrow button checks: is there debt already? Yes: \"You already borrowed once!\""], ["How does the timer stop early?", "Clicking Party Time puts 0 in Time, so the clock ends."], ["What would you improve?", "A guest list: more guests need more food."]], "visitors": [["What is owambe?", "A big Yoruba party with music, food and aso-ebi."], ["Can you win without borrowing?", "Yes. Jollof, canopy, DJ and small chops cost exactly ₦200,000."], ["What did you learn?", "Check the price before you buy, and plan for Monday."]], "next": ["A guest list.", "Choose how much to borrow.", "Save for 2 months before the party."], "practice": ["Say what the borrow button checks.", "Find 4 cards that cost exactly ₦200,000 on paper first.", "Make the budget ₦150,000. What is the best party now?", "Make the host say something new when joy is high.", "Plan a pretend party at home with paper money."], "guide": {"title": "The Great Owambe Budget", "intro": "₦200,000 and 30 seconds to plan a party. Click cards to buy. You can borrow ₦50,000 once, but on Monday the lender wants ₦60,000 back.", "sprites": [["Title", "The big \"Owambe Budget\" sign. It shows first."], ["Play Button", "PLAY. When clicked, the host starts talking."], ["Host", "The party host. She explains, worries when a card is too expensive, and dances at the party."], ["Jollof Card", "Buy jollof for ₦80,000. Budget goes down and Joy goes up by 1."], ["Canopy Card", "Buy canopy for ₦50,000. Budget goes down and Joy goes up by 1."], ["DJ Card", "Buy dj for ₦40,000. Budget goes down and Joy goes up by 1."], ["Aso-ebi Card", "Buy aso-ebi for ₦45,000. Budget goes down and Joy goes up by 1."], ["Decoration Card", "Buy decoration for ₦25,000. Budget goes down and Joy goes up by 1."], ["Small chops Card", "Buy small chops for ₦30,000. Budget goes down and Joy goes up by 1."], ["Borrow Button", "Borrow ₦50,000 once. The debt is ₦60,000, to pay on Monday."], ["Lender", "Lends ₦50,000, and comes back on Monday for ₦60,000."], ["Party Time Button", "The 30-second clock. Click it to start the party early."], ["Caption", "At the end, it says if the party was sweet or a "too expensive\""], ["lk", "switch costume to worried"], ["lk", "say \"We cannot afford that one!\" for 1.5 seconds"], ["lk", "switch costume to smile"]]]]]}, {"title": "Step 7: Borrowing, and the lender", "text": "The Borrow Button hears \"start planning\" and comes out. When clicked, it asks: is Debt ₦ > 0? YES: \"You already borrowed once!\" NO: Budget ₦ goes up by 50000, Debt ₦ goes up by 60000, and it shouts \"lender gives loan\". The Lender hears it, shows, says the deal and hides.", "qa": [["You borrow ₦50,000. How much must you pay back?", "₦60,000. Borrowing costs more."], ["Can you borrow twice?", "No. The button checks Debt ₦ first."]], "test": "Click BORROW: Budget ₦ goes up by 50000 and Debt ₦ becomes 60000. Click again: \"You already borrowed once!\"", "items": [["Borrow Button", [[["ev", "when I receive \"start planning\""], ["mo", "go to x: -140 y: -153"], ["lk", "show"]], [["ev", "when this sprite clicked"], ["ct", "if <(Debt ₦) > 0> then", [["so", "start sound buzz"], ["lk", "say \"You already borrowed once!\" for 1.5 seconds"]], [["so", "start sound cash"], ["vr", "change Budget ₦ by 50000"], ["vr", "change Debt ₦ by 60000"], ["ev", "broadcast \"lender gives loan\""]]]]]], ["Lender", [[["ev", "when I receive \"lender gives loan\""], ["mo", "go to x: 160 y: -100"], ["lk", "show"], ["lk", "say \"Here is ₦50,000. On Monday, pay me back ₦60,000!\" for 3 seconds"], ["lk", "hide"]]]]]}, {"title": "Step 8: The 30-second clock", "text": "The Party Time Button hears \"start planning\". It shows, then repeats until Time < 1: take 1 from Time, wait 1 second. Then it hides and shouts \"party starts\". When clicked, it asks: is Joy > 0? YES: it sets Time to 0, so the clock stops early. NO: \"Buy something first!\"", "qa": [["How can the party start before 30 seconds?", "Click PARTY TIME after buying something. It sets Time to 0."]], "test": "Buy one card, then click PARTY TIME: the planning ends.", "items": [["Party Time Button", [[["ev", "when I receive \"start planning\""], ["mo", "go to x: 130 y: -153"], ["lk", "show"], ["ct", "repeat until <(Time) < 1>", [["vr", "change Time by -1"], ["ct", "wait 1 seconds"]]], ["lk", "hide"], ["ev", "broadcast \"party starts\""]], [["ev", "when this sprite clicked"], ["ct", "if <(Joy) > 0> then", [["vr", "set Time to 0"]], [["lk", "say \"Buy something first!\" for 1.5 seconds"]]]]]]]}, {"title": "Step 9: The party", "text": "Everyone hears \"party starts\". The Stage switches to the compound. All cards and the Borrow Button hide. The Host moves to the middle, dances 6 times, then shouts \"check for debt\".", "qa": [["What does the Host shout after dancing?", "\"check for debt\"."]], "test": "When the planning ends, the compound shows and the host dances.", "items": [["Stage", [[["ev", "when I receive \"party starts\""], ["lk", "switch backdrop to compound"], ["so", "start sound fanfare"]]]], ["Jollof Card", [[["ev", "when I receive \"party starts\""], ["lk", "hide"]]]], ["Canopy Card", [[["ev", "when I receive \"party starts\""], ["lk", "hide"]]]], ["DJ Card", [[["ev", "when I receive \"party starts\""], ["lk", "hide"]]]], ["Aso-ebi Card", [[["ev", "when I receive \"party starts\""], ["lk", "hide"]]]], ["Decoration Card", [[["ev", "when I receive \"party starts\""], ["lk", "hide"]]]], ["Small chops Card", [[["ev", "when I receive \"party starts\""], ["lk", "hide"]]]], ["Borrow Button", [[["ev", "when I receive \"party starts\""], ["lk", "hide"]]]], ["Host", [[["ev", "when I receive \"party starts\""], ["mo", "go to x: -60 y: -70"], ["ct", "repeat 6", [["lk", "switch costume to dance"], ["ct", "wait 0.3 seconds"], ["lk", "switch costume to smile"], ["ct", "wait 0.3 seconds"]]], ["ev", "broadcast \"check for debt\""]]]]]}, {"title": "Step 10: Sweet party, or debt party?", "text": "The Caption hears \"check for debt\". It shows and asks: is Debt ₦ > 0? YES: \"debt party\" costume, wait 3 seconds, then shout \"monday comes\". NO: \"sweet\" costume. The game ends there.", "qa": [["Jollof, Canopy, DJ and Small chops, no borrowing. Which caption?", "Sweet party. Budget ₦ is 0 and there is no debt."]], "test": "Buy the 4 cards that make ₦200,000 with no borrowing: \"Sweet party!\"", "items": [["Caption", [[["ev", "when I receive \"check for debt\""], ["mo", "go to x: 0 y: 135"], ["lk", "show"], ["ct", "if <(Debt ₦) > 0> then", [["lk", "switch costume to debt party"], ["ct", "wait 3 seconds"], ["ev", "broadcast \"monday comes\""]], [["lk", "switch costume to sweet"]]]]]]]}, {"title": "Step 11: Monday comes", "text": "Everyone hears \"monday comes\". The Stage switches to the monday backdrop. The Caption hides. The Host looks worried. The Lender shows, asks for ₦60,000, and checks: is Budget ₦ < Debt ₦? YES: \"You still owe me.\" NO: Budget ₦ goes down by 60000, Debt ₦ becomes 0.", "qa": [["Borrow and spend everything. What does the lender say?", "\"You do not have enough! You still owe me. Wahala!\""]], "test": "Borrow, then buy until Budget ₦ is small: on Monday the lender says you still owe.", "items": [["Stage", [[["ev", "when I receive \"monday comes\""], ["lk", "switch backdrop to monday"]]]], ["Caption", [[["ev", "when I receive \"monday comes\""], ["lk", "hide"]]]], ["Host", [[["ev", "when I receive \"monday comes\""], ["lk", "switch costume to worried"], ["mo", "go to x: -205 y: -110"]]]], ["Lender", [[["ev", "when I receive \"monday comes\""], ["mo", "go to x: 200 y: -100"], ["lk", "show"], ["lk", "say \"It is Monday. Pay me my ₦60,000!\" for 2.5 seconds"], ["ct", "if <(Budget ₦) < (Debt ₦)> then", [["lk", "say \"You do not have enough! You still owe me. Wahala!\""]], [["vr", "change Budget ₦ by -60000"], ["vr", "set Debt ₦ to 0"], ["lk", "say \"Paid. But your party money is gone.\""]]]]]]]}], "files": ["01 Title.sprite3", "02 Play Button.sprite3", "03 Host.sprite3", "04 Jollof Card.sprite3", "05 Canopy Card.sprite3", "06 DJ Card.sprite3", "07 Aso-ebi Card.sprite3", "08 Decoration Card.sprite3", "09 Small chops Card.sprite3", "10 Borrow Button.sprite3", "11 Lender.sprite3", "12 Party Time Button.sprite3", "13 Caption.sprite3"]}, "simple": "A family has ₦200,000 and 30 seconds to plan a big party. You click cards to buy jollof, a canopy, a DJ and more. You can borrow money once, but on Monday the lender wants back more than you borrowed."}, {"id": "inflation-explainer", "title": "Inflation Explainer AI", "track": "ai", "school": "Yewa College", "lesson": "Check numbers yourself. Use AI to explain, not to calculate.", "line": "Type an item, your state and two prices. Our code does the maths, and the AI explains why the price went up.", "problem": "Prices keep rising, and many families and young people do not know why.", "who": "Families, students, market traders, young adults, and anyone paying for goods or services.", "how": ["Type the item and its type (for example Ofada rice), pick the unit, and choose your state.", "Type the old price and the new price, with the months you paid them. You can add your own question.", "Our code does all the maths: the difference, the percent change, the change per month, and what ₦1,000 is worth now.", "Press Explain. The AI explains the change in simple English with tips for Nigeria. Tick \"Deeper answer\" for more detail."], "ideas": [["Code does the maths", "The AI never calculates. Our code works out the numbers first, because code is always exact."], ["Price check", "When you choose a state, prices are compared with real records. A clear typing slip, like an extra zero, is corrected and shown to you."], ["Privacy filter", "Phone numbers, emails, account or ID numbers, and names after \"my name is\" are removed before the AI sees anything."], ["Guardrails", "The AI may use only our numbers and the national figures on the page. No made-up statistics. Short, simple English. Not financial advice."]], "tested": ["The example: a 50kg bag of local rice, February to March 2026, from the NBS average price. Press Explain and read the answer.", "Open \"Exactly what was sent to the AI\" to show the rules and the numbers our code sent.", "Use the rice example, choose a state, and add an extra zero to the new price: the price check shows the correction."], "speech": ["Prices keep rising, and many families do not know why. Our app, Inflation Explainer AI, is for families, students, traders and anyone who buys goods or services.", "You type an item, your state, and the old and new prices. Our code does the maths. Then the AI explains why the price went up, in simple English, with tips for Nigeria.", "The AI never does the maths: our code does, because code is exact. A privacy filter removes personal details. And you can see exactly what we sent to the AI.", "We tried it with the NBS rice price example and with a price that had an extra zero. Next, we want answers in Yoruba and Hausa. Our lesson: check the numbers, and use AI to explain."], "judges": [["What problem does your app solve?", "People feel prices rising but do not understand why. The app explains it in simple words."], ["Why does your code do the maths and not the AI?", "AI can make maths mistakes. Code gives the same exact answer every time."], ["What does the price check do?", "If you choose a state, it compares your prices with real records and corrects clear typing slips, like an extra zero. It shows you the change."], ["What does the privacy filter remove?", "Phone numbers, emails, account or ID numbers, and names after \"my name is\"."], ["Can the AI make up numbers?", "No. Our rules say it may use only our numbers and the national figures on the page."], ["Where is the secret key?", "Only on the server. It is never in the page or on screen."], ["Is this financial advice?", "No. It is a learning tool. The footer says so."], ["What would you improve?", "Answers in Yoruba and Hausa, and more local market prices."]], "visitors": [["Do I need to sign up?", "No. There is no sign-up and nothing is saved."], ["What is \"Deeper answer\"?", "Tick it before you press Explain to get a longer, more detailed answer."], ["What did you learn?", "AI is a helper. We set the rules and our code checks the numbers."]], "next": ["Answers in Yoruba and Hausa.", "More local market prices for each state.", "A chart of one item's price over a year."], "practice": ["Say the 4 steps: item, state, prices, Explain.", "Use the rice example and read the answer aloud.", "Open \"Exactly what was sent to the AI\" and explain each part.", "Try \"Deeper answer\" and compare it with the short answer.", "Check the price of one thing your family buys, and try it in the app."], "tested_label": "Show the judges", "live": "https://inflation-explainer.vercel.app/", "simple": "Prices keep going up. You type a thing, your state, its old price and its new price. Our code does the maths. Then the AI explains why the price went up, in easy words."}, {"id": "community-voice", "title": "Community Voice AI", "track": "ai", "school": "Yewa College", "lesson": "Speak up politely, and get things done.", "line": "Describe a problem in your community. The AI drafts a formal letter to the right office, and you edit it.", "problem": "Young people see real problems, like no clean water, a broken road or a dark street, but do not know how to write a formal letter about them.", "who": "Students and community members who want to report a problem politely and clearly.", "how": ["Fill 8 parts: the problem type, your state, your area (not your house address), how long, who is affected, who the letter is for, the tone, and the description (up to 1,000 characters).", "You can write in English or Pidgin. Not sure how to start? Tap an example: no water, dark street, bad road or blocked drain.", "Press \"Write My Letter\". The AI drafts a formal letter in a box you can edit, because you are the author.", "Copy, download or print the letter. The page also shows what you can do yourselves and where to send it, using only checked .gov.ng websites."], "ideas": [["8 clear fields", "Dropdowns for problem type, state, how long, who is affected, who it is for and the tone, plus your own description."], ["Privacy", "No sign-up, nothing saved. Names and phone numbers are removed. The area field says: do not type your house address."], ["You are the author", "The letter appears in an editable box. Read and edit every word before you send it."], ["For everyone", "A Sign Language page, night mode and bigger text (A+). It works fully without sound."]], "tested": ["Tap the \"No water\" example, fill the dropdowns, and press Write My Letter.", "Open \"See exactly what was sent to the AI\" and show that names and phone numbers are removed.", "Show the Sign Language page and the A+ text button."], "speech": ["Young people see real problems around us: no clean water, a broken road, a dark street. But we do not always know how to write a formal letter. Our app, Community Voice AI, helps.", "You fill 8 short parts: the problem, where, how long, who is affected, who the letter is for, and the tone. You can write in English or Pidgin. The AI drafts a formal letter that you edit.", "Our code removes names and phone numbers before anything reaches the AI, and you can see exactly what was sent. The page shows only checked .gov.ng offices, and it works without sound.", "We tried the example problems and edited the letters ourselves. Next, we want more offices for each state. Our lesson: speak up politely, and things can change."], "judges": [["What problem does your app solve?", "People do not know how to write a formal letter about a community problem. The app gives them a draft to edit."], ["Who writes the final letter?", "The student. The AI only drafts it in a box the student can edit. The page says: you are the author."], ["How do you protect privacy?", "No sign-up, nothing saved. Names and phone numbers are removed, and the area field asks for the area only, not a house address."], ["Who can the letter be for?", "Six choices: Local Government Chairman, a State Ministry or Agency, a Federal Agency, a School Principal, a Community Development Association, or a Traditional Ruler."], ["What tones can you choose?", "Polite request, firm and urgent, or follow-up if you wrote before."], ["How is it accessible?", "There is a Sign Language page, night mode and bigger text, and it works fully without sound."], ["What if there is an emergency?", "The footer says: in an emergency, call 112. The letter is for problems that can wait for an office to act."], ["What would you improve?", "More verified offices for each state, and letters in Yoruba and Hausa."]], "visitors": [["Can I write in Pidgin?", "Yes. The AI turns it into formal English."], ["Does the app send the letter?", "No. You copy, download or print it, and send it yourself."], ["What did you learn?", "Clear, polite words help people listen."]], "next": ["More verified offices for each state.", "Letters in Yoruba and Hausa.", "A follow-up reminder after two weeks."], "practice": ["Name all 8 parts of the form without looking.", "Use the \"Dark street\" example and press Write My Letter.", "Edit the letter: add one sentence of your own.", "Try the same problem as \"Polite request\" and as \"Firm and urgent\". Compare.", "Write a real, polite letter about one small problem in your school."], "tested_label": "Show the judges", "live": "https://community-voice-ai-ziry.vercel.app/", "simple": "You see a problem near you, like no water or a dark street. You answer a few short questions about it. The AI writes a polite, formal letter to the right office, and you can change every word."}, {"id": "career-compass", "title": "Naija Career Compass AI", "track": "ai", "school": "Yewa College", "lesson": "Many routes, one future: yours.", "line": "Pick what you enjoy. The AI suggests 3 careers, each with real Nigerian routes into it.", "problem": "Many secondary and tertiary students know only a few career options, and most career guidance is too general.", "who": "Secondary and tertiary students thinking about their future.", "how": ["Choose your favourite subject, then answer 5 short questions, like \"What do you lose track of time doing?\"", "Pick the education level you are aiming for and where you love to work. No name or age needed.", "Our code organises your answers, removes private details, and checks them. The AI replies with exactly 3 careers.", "Our code checks the guardrails and turns the answer into 3 cards with pictures, reasons, subjects and Nigerian routes."], "ideas": [["Guardrails", "Every career has a Nigerian route (university, polytechnic or trade). At least one is a skilled trade or hands-on path."], ["Never discourage", "The AI must never say a career is not for you because of who you are."], ["Privacy filter", "Phone numbers, emails, ID numbers, names and ages are removed before anything reaches the AI. No sign-up, nothing saved."], ["Secret key", "The AI key is paid for by an adult, lives only on the server, and is never shown on the page or screen."]], "tested": ["Fill the form and press \"Show me 3 careers\": 3 cards appear, each with a reason, subjects and Nigerian routes.", "Open \"See exactly what we sent to the AI\": our rules, and your answers after the privacy filter.", "Check the 3 cards: at least one is a skilled trade or hands-on path."], "speech": ["Many students know only a few careers, and career advice is often too general. Our app, Naija Career Compass AI, is for students thinking about their future.", "You pick your favourite subject and answer a few short questions about what you enjoy. The AI suggests 3 careers, with the subjects to focus on and real Nigerian routes into each one.", "Before anything reaches the AI, our code removes names, ages and phone numbers. After the AI answers, our code checks the guardrails: 3 careers, real routes, and at least one skilled trade.", "We tried very different answers and checked every card. Next, we want local training centres for each career. Our lesson: many routes, one future: yours."], "judges": [["What problem does your app solve?", "Students know few careers and get general advice. The app gives 3 ideas that match what they enjoy, with real Nigerian routes."], ["What are your guardrails?", "Every career has a Nigerian route. At least one is a skilled trade or hands-on path. The AI must never say a career is not for you because of who you are."], ["What does the privacy filter remove?", "Phone numbers, emails, ID numbers, names (including after \"my name is\") and ages."], ["Why does the AI reply as JSON?", "So our code can check the answer and turn it into cards with pictures."], ["Where is the secret key?", "Only on the server, paid for by an adult. Never on the page or screen."], ["Does the app decide a student's future?", "No. The footer says these are ideas to explore, not decisions. Talk to a parent or teacher."], ["What would you improve?", "Local training centres and programmes for each career."]], "visitors": [["Do I need to give my name?", "No. No name or age is needed, and nothing is saved."], ["Is a trade as good as university?", "Both are good routes. The app always shows at least one hands-on path."], ["What did you learn?", "AI needs clear rules and checks to be safe and fair."]], "next": ["Local training centres for each career.", "Answers in Yoruba and Hausa.", "Save a favourite career on your own phone."], "practice": ["Say the 4 steps in \"How it works\" without looking.", "Fill the form with your own answers and read your 3 cards.", "Open \"See exactly what we sent to the AI\" and explain both parts.", "Try very different answers and compare the careers.", "Ask an adult how they chose their job."], "tested_label": "Show the judges", "live": "https://naija-career-compass-ai.vercel.app/", "simple": "You pick your favourite subject and answer a few questions about what you enjoy. The app shows you 3 jobs you might like, and the real ways to get there in Nigeria."}, {"id": "scam-shield", "title": "Scam Shield", "track": "web", "school": "Yewa College", "lesson": "Think before you click.", "line": "Learn the signs of scam messages, practise spotting them, check a message, and take the quiz. Works offline.", "problem": "Scam messages reach phones every day: fake prizes, fake jobs, fake bank alerts and people pretending to be family.", "who": "Students, parents and anyone with a phone.", "how": ["Scam Types: 8 common scams, each with 3 red flags and 2 made-up example messages.", "Spot It: 8 practice messages (one is safe). Click every suspicious part, then press \"Check my answer\".", "Verify: paste a message and press \"Check this message\". It shows the warning signs, the closest example and what to do. You can save a report on your device.", "Q&A and Quiz: 21 answers from our own guide, and a 10-question quiz (+10 points for every correct answer) that unlocks badges."], "ideas": [["10 red-flag rules", "Each rule has words to look for and a weight. Asking for a PIN, payment or app install weighs 3. Others weigh 2."], ["Risk level", "Add the weights of the red flags found: 6 or more is HIGH, 3 or more is MEDIUM, else LOW."], ["Points and badges", "Spot It gives 5 points per red flag found, plus 10 for leaving the safe message alone. Badges: Scam Spotter at 30, Smart Checker at 100, Shield Guardian at 200."], ["Safe by design", "Works offline. All examples are made up, and links end in .example. Points and reports stay only on your device."]], "tested": ["Press \"Try a sample\" in Verify: the warning signs and a risk level appear.", "Do one Spot It message, then the safe message: points go up, with no false alarms on the safe one.", "Turn off your data and reload: it still works."], "speech": ["Scam messages reach our phones every day: fake prizes, fake jobs, fake bank alerts. Our website, Scam Shield, is for students, parents and anyone with a phone.", "You learn 8 common scam types, practise spotting red flags in 8 messages, check a real message for warning signs, and take a quiz to earn points and badges. It works offline.", "The checker has 10 red-flag rules. Each one has a weight. We add the weights: 6 or more is high risk, 3 or more is medium. Every example is made up, so no real company is named.", "We tested scam messages and a safe one. Next, we want Yoruba and Pidgin versions. Our lesson: stop, check, and ask a trusted adult before you click or pay."], "judges": [["What problem does your website solve?", "People lose money to scam messages. The site teaches them to spot the warning signs."], ["How does the checker decide the risk?", "It looks for 10 kinds of red flags. Each has a weight of 2 or 3. 6 or more is HIGH, 3 or more is MEDIUM, otherwise LOW."], ["Is it a real scam detector?", "No. The page says it is an educational tool, not a real scam-detection system. When in doubt, ask a trusted adult."], ["Why is one Spot It message safe?", "Not every message is a scam. The skill is to check calmly. Leaving the safe one alone earns 10 points."], ["How do the badges work?", "Points unlock them: Scam Spotter at 30, Smart Checker at 100, Shield Guardian at 200."], ["Where are points and reports saved?", "Only on the user's own device. Nothing is sent anywhere."], ["Why do links end in .example?", ".example can never be a real website, so nobody can click into a real scam."], ["What would you improve?", "Yoruba and Pidgin versions, and new scam examples every month."]], "visitors": [["Can it check my real messages?", "It looks for warning signs. It can be wrong, so always ask a trusted adult too. Remove names and numbers first."], ["What is the biggest red flag?", "Anyone who asks for your PIN, password, OTP or BVN, or asks you to pay first."], ["What did you learn?", "Scammers rush you. Slow down and check."]], "next": ["Yoruba and Pidgin versions.", "New scam examples every month.", "A way to share warnings with family on WhatsApp."], "practice": ["Name 3 red flags without looking.", "Finish all 8 Spot It messages. Which one is safe?", "Paste a made-up scam message into Verify and read the risk.", "Take the quiz and earn the Scam Spotter badge (30 points).", "Teach a parent the rule: never share your PIN or OTP."], "tested_label": "Show the judges", "live": "https://danieldave.github.io/scam-shield/", "simple": "Some phone messages are tricks to steal money. This website teaches you the signs of a trick message, lets you practise spotting them, and lets you check a message before you trust it."}, {"id": "harvest-calendar", "title": "Harvest Calendar Naija", "track": "web", "school": "Yewa College", "lesson": "Plant on time, harvest on time.", "line": "See when to plant and harvest six Nigerian crops, month by month.", "problem": "Planting at the wrong time can make a whole season fail.", "who": "Farmers, farming families and students learning agriculture.", "how": ["Six crops on one calendar: green means plant, gold means harvest.", "This month has a dark outline.", "Pick any month to see what to plant and harvest now.", "Press Play the year to watch the calendar move month by month."], "ideas": [["Events", "Picking a month redraws the page. Clicking a crop shows its tip."], ["Boxes", "One list holds all 6 crops and their months. currentMonth holds this month."], ["Checks", "For every square: plant month? harvest month? both? The answer picks the colour."], ["Repeat", "A loop inside a loop draws 6 crops × 12 months = 72 squares. A timer plays the year."]], "tested": ["Set the month to December: harvest maize, yam and cassava.", "Play the year: it moves one month every 1.2 seconds and stops after 12.", "Remove the \"+1\" and the page shows last month, because computers count January as 0."], "speech": ["Ask a farmer: when do you plant maize? Plant at the wrong time, and the whole season can fail. Our website, Harvest Calendar Naija, is for farmers and students.", "It shows six Nigerian crops on one calendar. Green means plant, gold means harvest. Pick a month to see what to do now, and click a crop to read its tip.", "A loop inside a loop draws 72 squares from a few lines of code. A check picks each square's colour. A timer plays the whole year like a film.", "We found a bug: the computer counts January as 0, so we add 1. Next, we want crops from our own farms and the rainy season for each state. Our lesson: plan, do not guess."], "judges": [["What problem does your website solve?", "Planting at the wrong time wastes a season. The calendar shows the right months."], ["Show us a loop.", "For every crop, then for every month 1 to 12: 72 squares."], ["Why do you add 1 to the month?", "JavaScript counts January as 0. Our data counts January as 1."], ["Are the months right for every farm?", "They are starter months. Places differ, so we always say: check with a local farmer."], ["What does the timer do?", "Play the year moves forward one month every 1.2 seconds and stops after 12 months."], ["What would you improve?", "Crops from our own farms, checked with farmers, and rainy seasons by state."]], "visitors": [["Does it work without data?", "Yes. It is one page that opens on any phone or laptop."], ["Can I add my own crop?", "Yes. Add one line to the crop list in the code."], ["What did you learn?", "A small mistake, like forgetting +1, can change everything. Testing finds it."]], "next": ["Crops from our own farms, checked with a farmer.", "Rainy seasons for each state.", "A reminder for the next planting month."], "practice": ["Say what green, gold and the dark outline mean.", "Add a seventh crop to the list.", "Change the timer from 1.2 seconds to 0.3. What happens?", "Ask a farmer near you when they plant one crop. Check the calendar.", "Explain the \"+1\" bug to someone at home."], "simple": "Farmers must plant and harvest at the right time. This website shows a calendar for six Nigerian crops. Green means plant. Gold means harvest."}, {"id": "apprentice-pathways", "title": "Apprentice Pathways Explorer", "track": "web", "school": "Yewa College", "lesson": "Learn a trade, build a future.", "line": "Explore trades and skills in Nigeria, with the training needed and a first step to take.", "problem": "Many young people think university is the only good route. They do not know about trades and apprenticeships.", "who": "Students, school leavers and parents.", "how": ["Search for a trade, or pick a group like technical or creative.", "Each card shows what the worker does and the skills needed.", "It explains how people learn the trade, often with a master.", "Every card ends with one small first step to try."], "ideas": [["Events", "Typing in the search box or clicking a group redraws the cards."], ["Boxes", "One list holds every trade. Another box remembers the chosen group."], ["Checks", "If a trade is not in the chosen group, or does not match the search, it is skipped. Nothing left: \"No trade found\"."], ["Repeat", "A loop builds one card for every trade in the list."]], "tested": ["Search \"tailor\": the tailoring card shows.", "Search a word with no match: \"No trade found\".", "Pick a group: only those trades show."], "speech": ["Many young people think university is the only good route. But many good careers start with an apprenticeship. Our website, Apprentice Pathways Explorer, is for students and parents.", "You search for a trade or pick a group. Each card shows what the worker does, the skills, how people learn it, and a first step you can try.", "All the trades live in one list. A loop builds a card for each one. A check skips the ones that do not match your search, so you only see what you asked for.", "We tested searches that match and searches that do not. Next, we want training centres near each school. Our lesson: a trade is a real future."], "judges": [["What problem does your website solve?", "Young people do not know about trades. The site shows them real routes."], ["Why show trades and not only university?", "Many good careers start with an apprenticeship."], ["Show us a check.", "If a trade does not match the search function daysLeft(){
  const t = new Date(D.showcase.date + 'T09:00:00+01:00');
  const now = new Date();
  const a = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const b = Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate());
  return Math.round((b - a) / 864e5);
}
function countdown(){
  const n = daysLeft();
  if (n > 1) return `<span class="pill go"><b>${n}</b> days to go</span>`;
  if (n === 1) return `<span class="pill go"><b>1</b> day to go. Tomorrow!</span>`;

}

  <div><h2>Judges may ask</h2><div class="qa">${p.judges.map(([q,a])=>`<details class="q"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}
    <details class="q"><summary>Did you build this yourselves?</summary><p>${esc(D.trust[p.track])}</p></details></div></div>
  <div><h2>Visitors may ask</h2><div class="qa">${p.visitors.map(([q,a])=>`<details class="q"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div></div>
  <div class="box"><h3>If you do not know the answer</h3><p>Say: "That is a good question. We have not tested that yet, but we will find out." Never guess. You can also pass the question to a teammate.</p></div>`;
}
function practice(p){
  const saved = store.get('tasks:' + p.id, []);
  return `
  <div><h2>Practise until it is easy</h2><p class="hint">Do one task a day. Tick it when your whole team can do it. Ticks stay on this device.</p></div>
  <div class="progress"><div class="meter"><i id="pbar" style="width:${saved.filter(Boolean).length*20}%"></i></div><b id="pcount">${saved.filter(Boolean).length}/5</b></div>
  <div class="tasks">${p.practice.map((t,j)=>`<label class="task ${saved[j]?'done':''}" for="t${j}"><input type="checkbox" id="t${j}" data-j="${j}" ${saved[j]?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div>`;
}
function bindProject(p){
  const tabs = document.querySelectorAll('[data-tab]');
  tabs.forEach(t => t.onclick = () => {
    tabs.forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); document.getElementById('pane-' + x.dataset.tab).hidden = !on; });
    const tb = document.querySelector('.tabs'); if (tb.getBoundingClientRect().top < 60) tb.scrollIntoView({block:'start'});
  });
  // timer
  const T = 120, clock = $('#clock'), go = $('#tgo');
  const bars = [...document.querySelectorAll('.tbar span')];
  let start = 0, used = 0, iv = null;
  const paint = () => {
    const s = Math.min(T, used + (iv ? (Date.now() - start) / 1000 : 0));
    const left = Math.ceil(T - s);
    clock.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    const part = Math.min(3, Math.floor(s / 30));
    bars.forEach((b, j) => b.style.width = Math.max(0, Math.min(1, (s - j * 30) / 30)) * 100 + '%');
    document.querySelectorAll('.part').forEach((el, j) => el.classList.toggle('now', (iv || s > 0) && j === part && s < T));
    if (s >= T && iv) { clearInterval(iv); iv = null; used = T; go.textContent = 'Done'; go.disabled = true; clock.textContent = 'Time!'; }
  };
  go.onclick = () => {
    if (iv) { used += (Date.now() - start) / 1000; clearInterval(iv); iv = null; go.textContent = 'Continue'; }
    else { start = Date.now(); iv = setInterval(paint, 200); go.textContent = 'Pause'; }
    paint();
  };
  $('#treset').onclick = () => { clearInterval(iv); iv = null; used = 0; go.disabled = false; go.textContent = 'Start'; paint(); };
  timerState = () => clearInterval(iv);
  // drill
  const pool = p.judges.concat(p.visitors); let last = -1, cur = null;
  $('#dnext').onclick = () => {
    let k; do { k = Math.floor(Math.random() * pool.length); } while (pool.length > 1 && k === last);
    last = k; cur = pool[k];
    $('#dask').textContent = cur[0]; $('#dans').hidden = true; $('#dshow').disabled = false; $('#dnext').textContent = 'Next question';
  };
  $('#dshow').onclick = () => { if (!cur) return; $('#dans').textContent = cur[1]; $('#dans').hidden = false; };
  // tasks
  document.querySelectorAll('.task input').forEach(c => c.onchange = () => {
    const s = store.get('tasks:' + p.id, []); s[+c.dataset.j] = c.checked; store.set('tasks:' + p.id, s);
    c.closest('.task').classList.toggle('done', c.checked);
    const n = s.filter(Boolean).length; $('#pbar').style.width = n * 20 + '%'; $('#pcount').textContent = n + '/5';
  });
}

/* ---------- WORDS ---------- */
let wf = 'all';
function words(){
  return `<div class="wrap narrow" style="max-width:1080px"><section class="sec">
    <div class="sec-head"><div><div class="eyebrow">Words we use</div><h2 style="margin-top:8px">Say it simply</h2>
    <p class="sub">Every coding word, with a simple meaning and an everyday example. Use these words when you talk to the judges.</p></div></div>
    <div class="filters" role="group" aria-label="Filter words">
      ${[['all','All words'],['scratch','Scratch'],['ai','AI apps'],['web','Websites']].map(([k,l])=>`<button class="chip" data-wf="${k}" aria-pressed="${wf===k}">${k!=='all'?`<span class="dot ${k}"></span>`:''}${l}</button>`).join('')}
      <label class="search"><span class="sr">Search words</span><input id="wq" type="search" placeholder="Search a word..."></label>
    </div>
    <div class="words" id="wlist"></div>
  </section></div>`;
}
function wlist(){
  const q = ($('#wq').value || '').trim().toLowerCase();
  const L = D.words.filter(([w,t,m,e]) => (wf==='all'||t===wf||t==='all') && (!q || (w+' '+m+' '+e).toLowerCase().includes(q)));
  $('#wlist').innerHTML = L.length ? L.map(([w,t,m,e]) => `<div class="word ${t!=='all'?'t-'+t:''}"><h3>${esc(w)}${t!=='all'?`<span class="tag">${esc(D.tracks[t].short)}</span>`:''}</h3><p>${esc(m)}</p><p class="eg"><b>Example:</b> ${esc(e)}</p></div>`).join('')
    : `<div class="empty">No word found. Try a shorter word.</div>`;
}
function bindWords(){
  document.querySelectorAll('[data-wf]').forEach(b => b.onclick = () => { wf = b.dataset.wf; document.querySelectorAll('[data-wf]').forEach(x => x.setAttribute('aria-pressed', x === b)); wlist(); });
  $('#wq').oninput = wlist; wlist();
}

/* ---------- ON THE DAY ---------- */
const CHECK = ['Charge the laptop or phone fully.', 'Save the project on a flash drive too.', 'Record a short phone video of the project working, as a backup.', 'Practise the speech twice with the timer.', 'Practise 5 judges\' questions with a friend.', 'Sleep early. Eat breakfast.'];
function day(){
  const s = store.get('day', []);
  return `<div class="wrap"><section class="sec">
    <div class="sec-head"><div><div class="eyebrow">${esc(D.showcase.label)} · ${esc(D.showcase.city)}</div><h2 style="margin-top:8px">On the day</h2>
    <p class="sub">A calm plan for every team. Read it the night before.</p></div>${countdown()}</div>
    <div class="day">
      <div class="box"><h2>The night before</h2><div class="tasks">${CHECK.map((t,j)=>`<label class="task ${s[j]?'done':''}" for="d${j}"><input type="checkbox" id="d${j}" data-d="${j}" ${s[j]?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div></div>
      <div class="box"><h2>At your table</h2><ul class="ul">
        <li>Arrive early. Open your project before visitors come.</li>
        <li>Greet every visitor and smile.</li><li>One person speaks at a time. The others show the project.</li>
        <li>Let visitors try it. Watch what they do: that is feedback.</li></ul>
        <p class="say">"Good morning. Welcome to our table. Can we show you what we built?"</p></div>
      <div class="box"><h2>If something breaks</h2><ul class="ul">
        <li>Stay calm. It happens to every builder.</li><li>Restart the project once.</li>
        <li>Still not working? Show the backup video and explain what should happen.</li>
        <li>AI app with no internet? It shows a sample answer. Say so honestly.</li></ul>
        <p class="say">"Something went wrong. Let us show you our recording, and tell you how we would fix it."</p></div>
      <div class="box"><h2>A hard question</h2><ul class="ul">
        <li>Take a breath. It is fine to think for a moment.</li><li>Show the answer in your project if you can.</li>
        <li>If you do not know, say so. Never guess.</li></ul>
        <p class="say">"That is a good question. We have not tested that yet, but we will find out."</p></div>
      <div class="box"><h2>Stay safe</h2><ul class="ul">
        <li>Never show a secret key, password or PIN on screen.</li><li>Do not type your real name, phone number or address into a project.</li>
        <li>An adult looks after any online account.</li><li>Use made-up names for brands, banks and people.</li></ul></div>
      <div class="box"><h2>Who built it?</h2><p>Every team says the same honest thing:</p>
        <p class="say">"${esc(D.trust.scratch)}"</p>
        <p class="hint" style="margin-top:8px">AI teams say "starter app". Website teams say "starter web page".</p></div>
    </div>
  </section></div>`;
}
function bindDay(){
  document.querySelectorAll('[data-d]').forEach(c => c.onchange = () => {
    const s = store.get('day', []); s[+c.dataset.d] = c.checked; store.set('day', s); c.closest('.task').classList.toggle('done', c.checked);
  });
}

/* ---------- ROUTER ---------- */
function route(){
  if (timerState) { timerState(); timerState = null; }
  const h = decodeURIComponent(location.hash.slice(1));
  const app = $('#app');
  let nav = 'home';
  if (BY[h]) { app.innerHTML = project(BY[h]); bindProject(BY[h]); nav = ''; window.scrollTo(0, 0); }
  else if (h === 'words') { app.innerHTML = words(); bindWords(); nav = 'words'; window.scrollTo(0, 0); }
  else if (h === 'on-the-day') { app.innerHTML = day(); bindDay(); nav = 'on-the-day'; window.scrollTo(0, 0); }
  else {
    const fromProject = !!app.querySelector('.p-head');
    app.innerHTML = home(); bindHome();
    if (h === 'projects') { const el = document.getElementById('projects'); if (el) el.scrollIntoView(); }
    else if (fromProject || h) window.scrollTo(0, 0);
  }
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
window.addEventListener('hashchange', route);
route();
</script>
